<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Co-op Bread Bakery</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="baker-modal" class="modal-overlay hidden">
    <div class="card">
      <h1>Welcome, Baker!</h1>
      <p style="font-size: 0.9rem; color: #a0a0a0;">Enter your name to start baking:</p>
      <form id="baker-form">
        <input type="text" id="baker-name-input" class="modal-input" placeholder="e.g. Master Sourdough" maxlength="20" required autocomplete="off" />
        <button type="submit">Start Baking</button>
      </form>
      <button type="button" id="anon-bake-btn" class="btn-secondary">Bake Anonymously</button>
    </div>
  </div>

  <div class="app-container">
    <!-- Main Bakery Card -->
    <div class="card">
      <div id="baker-display" class="baker-greeting"></div>
      <h1>Shared Bakery</h1>
      
      <div class="counter-label">Bread Baked Globally</div>
      <div id="global-bread-count" class="counter">0</div>
      
      <div class="counter-label">Bread You've Baked</div>
      <div id="personal-bread-count" class="counter-secondary">0</div>
      
      <button id="bake-button">🍞 Bake Bread</button>

      <div class="status">
        <span class="badge"></span>
        <span id="player-count">1</span> <span id="baker-label">Baker</span> Online
      </div>
    </div>

    <!-- Leaderboard Card -->
    <div class="card">
      <h1>Top Bakers</h1>
      <div id="leaderboard-list" class="leaderboard-list">
        <!-- Leaderboard items rendered dynamically -->
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
